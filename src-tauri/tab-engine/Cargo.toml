[package]
name = "tab-engine"
version = "0.1.0"
edition = "2021"
description = "Typst-Markdown rendering engine"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
name = "tab_engine"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tab-engine"
path = "src/main.rs"

[features]
default = ["cli"]
wasm = ["wasm-bindgen"]
cli = ["clap"]
docx = ["cli", "docx-rs", "zip"]

[dependencies]
typst = "0.15"
typst-svg = "0.15"
typst-layout = "0.15"
typst-html = "0.15"
pulldown-cmark = "0.12"
roxmltree = "0.20"
zip = { version = "0.6", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
wasm-bindgen = { version = "0.2", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
docx-rs = { version = "0.4", optional = true }

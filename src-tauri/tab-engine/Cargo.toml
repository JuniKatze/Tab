[package]
name = "tab-engine"
version = "0.1.0"
edition = "2021"
description = "Typst-Markdown rendering engine"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
name = "tab_engine"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tab"
path = "src/main.rs"

[features]
default = ["cli"]
wasm = ["wasm-bindgen"]
cli = ["clap"]
docx = ["cli", "resvg", "usvg", "docx-rs"]

[dependencies]
typst = "0.15"
typst-svg = "0.15"
typst-layout = "0.15"
pulldown-cmark = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
resvg = { version = "0.47", optional = true }
usvg = { version = "0.47", optional = true }
docx-rs = { version = "0.4", optional = true }

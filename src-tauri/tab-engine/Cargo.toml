[package]
name = "tab-engine"
version = "0.1.0"
edition = "2021"
description = "Typst-Markdown rendering engine"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = ["wasm-bindgen"]

[dependencies]
typst = "0.15"
typst-svg = "0.15"
typst-layout = "0.15"
pulldown-cmark = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }
